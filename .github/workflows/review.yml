name: RabbitAI Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  review:
    runs-on: ubuntu-latest

    permissions:
      pull-requests: write   # needed to post PR comments
      contents: read         # needed to checkout code

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run RabbitAI
      - env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

          # Provider selection
          VECTOR_STORE_PROVIDER: ${{ vars.VECTOR_STORE_PROVIDER }}   # chromadb | pinecone | qdrant
          EMBEDDING_PROVIDER: ${{ vars.EMBEDDING_PROVIDER }}         # gemini | openai
          EMBEDDING_MODEL: ${{ vars.EMBEDDING_MODEL }}               # optional override
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}                     # gemini | openai
          LLM_MODEL: ${{ vars.LLM_MODEL }}                           # optional override
          REVIEW_LANGUAGE: ${{ vars.REVIEW_LANGUAGE }}               # typescript | python | go etc
        run: |
          python -c "
          import os
          from agent import run

          repo = os.environ['GITHUB_REPOSITORY']
          pr_number = int(os.environ['PR_NUMBER'])

          result = run(repo, pr_number)
          if result.posted:
              print(f'Review posted: {result.comment_url}')
          else:
              print(f'Skipped: {result.reason}')
          "