# RabbitAI — config.example.yaml
#
# Copy this file to config.yaml and fill in your values.
# config.yaml is gitignored — never commit it.
#
# In GitHub Actions, all values are injected via repository secrets.
# config.yaml is not needed in CI — only for local development.

# Authentication

# GitHub Personal Access Token
# Required scope: repo (full control of private repositories)
# Only needed for local development.
# GitHub Actions injects GITHUB_TOKEN automatically — do not add it as a secret.
# Generate at: github.com → Settings → Developer settings → Personal access tokens → Tokens (classic)
github_token: ""

# Gemini API key
# Required if embedding.provider or llm.provider is set to "gemini".
# Free tier available at: aistudio.google.com
gemini_api_key: ""

# Vector Store
# Stores embedded PR diff chunks for semantic retrieval (RAG pipeline).
# Supported providers: chromadb | pinecone | qdrant

vector_store:
  # ── ChromaDB (local, free — recommended for getting started)
  # No API key required. Data persists in a local folder.
  # provider: "chromadb"
  # path: "./chroma_db"
  # collection: "pr-chunks"

  # Pinecone (cloud)
  # Create a free index at app.pinecone.io
  # Index dimensions must match your embedding model output:
  #   gemini-embedding-001     → 768
  #   text-embedding-3-small   → 1536
  #   text-embedding-3-large   → 3072
  provider: "pinecone"
  api_key: ""
  index_name: "rabbitai"
  collection: "pr-chunks"

  # Qdrant (self-hosted)
  # provider: "qdrant"
  # host: "localhost"
  # port: 6333
  # collection: "pr-chunks"

  # Qdrant (cloud)
  # provider: "qdrant"
  # host: "https://your-cluster.qdrant.io"
  # api_key: ""
  # collection: "pr-chunks"

# Embedding Model
# Controls how PR diff chunks are embedded before storage and retrieval.
# Must match the dimension of your vector store index.
# Supported providers: gemini | openai

embedding:
  provider: "openai"
  model: "text-embedding-3-small" # outputs 1536 dims
  api_key: "" # required for openai; gemini uses gemini_api_key above

  # Gemini alternative (768 dims — use with a 768-dim vector store index):
  # provider: "gemini"
  # model: "models/gemini-embedding-001"

# LLM (Review Generation)
# Controls which model generates the actual code review.
# Supported providers: gemini | openai

llm:
  provider: "openai"
  model: "gpt-4.1-mini" # fast, low cost, strong at code review
  api_key: "" # required for openai; gemini uses gemini_api_key above

  # Gemini alternative:
  # provider: "gemini"
  # model: "gemini-2.0-flash"

# Memory
# Persistent memory across PR reviews using mem0.
# RabbitAI learns repo conventions, recurring issues, and patterns over time.

memory:
  # Set to false to disable persistent memory.
  # When disabled, only repo_context below is used (static, injected every review).
  enabled: true

  # Static context injected into every review prompt from day one.
  # Describe your repo so RabbitAI understands it before seeing any PRs.
  # The more detail you provide here, the better the early reviews will be.
  repo_context: |
    Replace this with a description of your repository.
    Example: This is a Next.js 15 application using Drizzle ORM, TypeScript strict mode,
    Supabase Auth, and Vercel for deployment. Prefer functional React components.
    No class components. All API routes use Next.js App Router Route Handlers.

# Review Behaviour

review:
  # Primary language of the repository.
  # Used to give the LLM language-specific context during review.
  # Examples: typescript | python | go | rust | java
  language: "typescript"

  # Areas to focus the review on.
  # Supported values: bugs | security | performance | design | tests | docs
  focus:
    - bugs
    - security
    - performance

  # Minimum risk threshold for posting a comment.
  # RabbitAI skips posting if the PR score is ABOVE this value.
  # A score of 8/10 means the PR is mostly good — you may not want a comment for that.
  # Set to 0 to always post regardless of score.
  min_risk_score: 3

  # Whether to include the 1–10 quality score in the posted PR comment.
  post_score: true
