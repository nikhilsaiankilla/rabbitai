[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rabbitai-reviewer"
version = "0.1.2"
description = "AI-powered PR reviewer with blast radius detection"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Nikhil sai ankilla", email = "nikhilsaiankilla@gmail.com" }]
keywords = ["ai", "code-review", "github", "langgraph", "pr-reviewer"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "langgraph>=0.2",
    "mem0ai>=0.1",
    "networkx>=3.0",
    "PyGithub>=2.0",
    "chromadb>=0.5",
    "openai>=1.0",
    "google-genai>=0.6",
    "pydantic>=2.0",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
    "langchain-core>=0.1",
    "pinecone>=3.0",
    "qdrant-client>=1.0",
]

[project.urls]
Homepage = "https://github.com/nikhilsaiankilla/rabbitai"
Documentation = "https://rabbitai.nikhilsai.in"

[tool.hatch.build.targets.wheel]
packages = ["rabbitai"]